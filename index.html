<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EasyConfig</title>
  
  <!-- CDN pour que React marche dans le navigateur -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body { background: #0f172a; color: white; font-family: sans-serif; padding: 20px; }
    .ec-diagram { display: flex; gap: 20px; flex-wrap: wrap; }
    .ec-node { border: 1px solid #334155; padding: 15px; border-radius: 10px; text-align: center; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    function App() {
      const nodes = [
        { icon: "monitor", label: "PC" },
        { icon: "router", label: "Switch" },
        { icon: "router", label: "Routeur" },
        { icon: "server", label: "Serveur" },
      ];

      return (
        <div>
          <h1>EasyConfig</h1>
          <div className="ec-diagram">
            {nodes.map((n, i) => (
              <div className="ec-node" key={i}>
                <i data-lucide={n.icon} style={{width:22, height:22}}></i>
                <div>{n.label}</div>
              </div>
            ))}
          </div>
        </div>
      );
    }
    
    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
  <script>lucide.createIcons();</script>
</body>
</html>
